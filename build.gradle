// r73：L5 时间静止仿写梦幻终焉 —— 用 buildscript classpath 引入 mixingradle（plugins {} DSL
// 解析 plugin marker 失败时回退到 classpath 方式，可以直接命中 SpongePowered maven 里的 jar）
buildscript {
    repositories {
        maven { url 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}
plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
apply plugin: 'org.spongepowered.mixin'
version = '1.1.8'
group = 'cn.blockforge.generated.floralritebloomcurios'
base { archivesName = 'floral_rite_bloom_curios' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.20.1' }
repositories {
    maven { name = 'Illusive Soulworks maven'; url = 'https://maven.theillusivec4.top/' }
    // mixingradle 0.7-SNAPSHOT 仅在 snapshot 仓库发布
    maven { name = 'SpongePowered Snapshots'; url = 'https://repo.spongepowered.org/repository/maven-public/' }
    // Mixin 0.8.5 在 Maven Central 也有稳定发布
    mavenCentral()
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
    // 编译使用 src/main/java/top/theillusivec4 下的 API 桩（打包时排除），
    // 桩签名已逐一用 javap 对照真实 curios-forge-5.14.1+1.20.1 校准；
    // 运行期（开发时 runClient）仍解析真正的 Curios 模组。
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:5.14.1+1.20.1")
    // JEI 是可选前置：本模组只带 src/main/java/mezz/jei 下的编译期桩（同样打包排除），
    // 玩家装了 JEI 才会有那两页配方，没装也完全不影响进游戏，产物里也不内嵌 JEI。
    // GeckoLib：丰饶 3D 模型渲染（与铁魔法盔甲/镰刀同一渲染链），必需前置；
    // 直接引用玩家 mods 目录里的运行时 jar 做编译/开发期依赖，打包产物不内嵌。
    implementation fg.deobf(files("D:/mc/.minecraft/versions/1.20.1-Forge_47.4.10/mods/geckolib-forge-1.20.1-4.8.4.jar"))
    // r73：Mixin 编译期处理器（mixingradle 0.7-SNAPSHOT 不会自动把它挂到 annotationProcessor 上，
    // 需要手动添加；运行时由 Forge 自带的 Mixin 处理，本 jar 不内嵌）
    annotationProcessor "org.spongepowered:mixin:0.8.5"
    // Mixin 处理器需要 Gson + Guava + ASM 才能跑（ASM 用于扫描 @Mixin 类的字节码）
    annotationProcessor "com.google.code.gson:gson:2.10.1"
    annotationProcessor "com.google.guava:guava:32.1.3-jre"
    annotationProcessor "org.ow2.asm:asm:9.7"
    annotationProcessor "org.ow2.asm:asm-tree:9.7"
    annotationProcessor "org.ow2.asm:asm-commons:9.7"
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
// r73：L5 时间静止 Mixin 清单（Level / ParticleEngine / Curios 附魔 glyph）
mixin {
    add(sourceSets.main, "mixins.fl_rite.refmap.json")
    config 'mixins.fl_rite.json'
}
// 编译桩（top.theillusivec4.* 与 mezz.jei.*）只服务于编译期，绝不随模组分发。
jar {
    exclude 'top/theillusivec4/**'
    exclude 'mezz/jei/**'
}
processResources {
    def props = [mod_id: 'floral_rite_bloom_curios', mod_name: '花仪绽放', mod_version: project.version,
                 minecraft_version: '1.20.1', forge_version: '47.4.0']
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/mods.toml') { expand props }
}
jar.finalizedBy('reobfJar')
